<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TamaMPE Virtual FM-1</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#11151b;color:#e8edf5;font:14px system-ui}main{max-width:960px;margin:auto;padding:24px}.device{background:#262b33;border:1px solid #3e4654;border-radius:20px;padding:24px;display:grid;gap:18px}.top{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap}canvas{width:min(72vw,360px);height:min(72vw,360px);image-rendering:pixelated;background:#000;border:12px solid #101318;border-radius:8px}button,input{font:inherit}.button,.encoder,.key{color:#eef2f7;background:#3d4551;border:1px solid #596473;border-radius:7px;padding:10px;touch-action:none}.button:active,.encoder:active,.key:active{background:#93d6ba;color:#10221b}.button.lit,.encoder.lit,.key.lit{box-shadow:0 0 12px #94e6bf;background:#76c99c;color:#10221b}.button.dim,.encoder.dim,.key.dim{box-shadow:0 0 6px #6f9c83}.button{min-width:60px}.encoder{min-width:96px;height:54px;cursor:ns-resize}.key{width:42px;height:94px;background:#e9e5da;color:#17202b;border-radius:0}.key.black{background:#1a2029;color:#eee;height:62px}#buttons,#encoders,#keys{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#keys{gap:1px}label{display:grid;gap:6px;text-align:center}#start{padding:12px 22px;border:0;border-radius:8px;cursor:pointer}small{opacity:.75}
</style><main><h1>TamaMPE Virtual FM-1</h1><p>Panel, pantalla y audio ejecutados por el firmware C de TamaMPE mediante WebAssembly.</p><div class="device"><div class="top"><canvas id="screen" width="240" height="240" aria-label="Pantalla TamaMPE"></canvas><div><button id="start">Activar audio y firmware</button><p id="status">Apagado.</p><label>MASTER <input id="master" type="range" min="0" max="1023" value="700"></label></div></div><div id="encoders" aria-label="Encoders"></div><div id="buttons" aria-label="Botones"></div><div id="keys" aria-label="Teclado FM-1"></div></div><p><small>Herramienta de desarrollo TamaMPE. La pantalla se dibuja desde el código de interfaz del firmware; no es una imitación HTML.</small></p></main><script type="module" src="./main.js"></script></html>
